<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Сравнение экономичности моделей Codex</title>
<style>
:root{--fg:#1f2328;--muted:#59636e;--line:#d0d7de;--soft:#f6f8fa;--link:#0969da}*{box-sizing:border-box}body{margin:0;color:var(--fg);background:#fff;font:16px/1.62 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}main{max-width:1040px;margin:0 auto;padding:42px 28px 80px}h1{font-size:2.05rem;line-height:1.2}h2{margin-top:2.2em;border-bottom:1px solid var(--line);padding-bottom:.3em}h3{margin-top:1.7em}a{color:var(--link)}table{border-collapse:collapse;width:100%;display:block;overflow:auto;margin:1em 0}th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;white-space:nowrap}th{background:var(--soft)}code{background:var(--soft);padding:.15em .35em;border-radius:5px}pre{background:var(--soft);padding:16px;overflow:auto;border-radius:8px}pre code{padding:0}img{max-width:100%;height:auto}.note{color:var(--muted);font-size:.92rem;margin-bottom:2rem}.loading{padding:4rem 0;color:var(--muted)}@media(max-width:600px){main{padding:24px 14px 60px}h1{font-size:1.65rem}}
</style>
<script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},startup:{typeset:false}};</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body><main>
<div class="note">Публичная веб-версия отчёта от 20 августа 2026 года.</div>
<div id="content" class="loading">Загрузка отчёта…</div>
</main>
<script type="module">
import {marked} from 'https://cdn.jsdelivr.net/npm/marked/lib/marked.esm.js';
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
const parts=Array.from({length:7},(_,i)=>`report/part-${String(i+1).padStart(2,'0')}.md`);
try{
  let md=(await Promise.all(parts.map(u=>fetch(u).then(r=>{if(!r.ok)throw new Error(r.status);return r.text()})))).join('\n');
  md=md.replaceAll('../codex_cost_vs_model_weekly_limits.svg','codex_cost_vs_model_weekly_limits.svg')
       .replaceAll('../codex_model_cost_comparison_2026-08-20.csv','codex_model_cost_comparison_2026-08-20.csv')
       .replaceAll('../codex_model_raw_rates_2026-08-20.csv','codex_model_raw_rates_2026-08-20.csv');
  const el=document.getElementById('content'); el.className=''; el.innerHTML=marked.parse(md);
  for(const code of [...document.querySelectorAll('pre code.language-mermaid')]){const d=document.createElement('div');d.className='mermaid';d.textContent=code.textContent;code.parentElement.replaceWith(d)}
  mermaid.initialize({startOnLoad:false,theme:'neutral'}); await mermaid.run({querySelector:'.mermaid'});
  const typeset=()=>window.MathJax?.startup?.promise?.then(()=>MathJax.typesetPromise());
  if(window.MathJax?.startup?.promise) typeset(); else setTimeout(typeset,800);
}catch(e){document.getElementById('content').innerHTML='<p>Не удалось загрузить части отчёта. Откройте исходники на GitHub.</p>';console.error(e)}
</script></body></html>
