<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>GP · Локальные данные класса</title>
<style>:root{color-scheme:dark;font:16px/1.5 system-ui;background:#16202b;color:#eef4fa}body{max-width:760px;margin:7vh auto;padding:20px}main{background:#223244;border:1px solid #465a72;padding:28px;border-radius:18px}h1{font-size:1.55rem}p{color:#c6d4e4}label{display:block;margin:15px 0}input{display:block;width:100%;box-sizing:border-box;padding:12px;border:1px solid #8596ad;background:#192533;border-radius:8px;color:inherit}button{padding:12px 17px;margin:8px 8px 8px 0;border:0;border-radius:8px;cursor:pointer;background:#accaf6;color:#182532;font-weight:700}#status{background:#121c28;padding:14px;border-radius:8px;white-space:pre-line}</style>
<script src="./export.js" defer></script></head><body><main>
<h1>Восстановить ваши исходные таблицы</h1>
<p>Готовит две локальные HTML-страницы с исходными списками класса, оценками, посещаемостью и поездкой. Данные не публикуются в GitHub.</p>
<div id="codes" hidden><label>Код исходной базы посещаемости<input id="attendanceCode" type="password" autocomplete="off"></label><label>Код исходной базы поездки<input id="tripCode" type="password" autocomplete="off"></label><button id="create" type="button">Создать локальные страницы</button></div>
<p id="status" role="status">Загрузка…</p>
<div id="downloads" hidden><button id="saveAttendance" type="button">Скачать журнал HTML</button><button id="saveTrip" type="button">Скачать поездку HTML</button><p>Откройте скачанные файлы двойным щелчком. Интернет и сервер не нужны. Не публикуйте файлы, содержащие полные списки.</p></div>
</main></body></html>
